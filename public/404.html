<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Loading…</title>
    <script>
      // GitHub Pages serves this file for any path it has no file for, which
      // for a single-page application is every route except the index.
      // Remember where the visitor was going, then hand back to index.html,
      // which restores it before the router starts.
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;

        // A project site lives under /<repo>/, so strip that prefix before
        // storing and send the visitor back to the same prefix.
        var segments = window.location.pathname.split('/').filter(Boolean);
        var base = '/';
        if (segments.length > 0 && window.location.hostname.endsWith('github.io')) {
          base = '/' + segments[0] + '/';
          path = path.replace(base, '/');
        }

        try {
          sessionStorage.setItem('spa-redirect', path);
        } catch (e) {
          /* Storage unavailable: the visitor lands on the home route instead. */
        }

        window.location.replace(base);
      })();
    </script>
  </head>
  <body>
    <p>Loading…</p>
  </body>
</html>
