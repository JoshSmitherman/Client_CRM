<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Client Portal</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      (function () {
        try {
          var stored = localStorage.getItem('crm-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* Private browsing or blocked storage: fall back to the light theme. */
        }
      })();
    </script>
    <script>
      // GitHub Pages has no server-side rewrite, so a deep link such as
      // /projects/abc returns 404.html. That file stores the requested address
      // and redirects here; this puts it back before React Router starts, so
      // refreshing a page and sharing a link both work.
      (function () {
        try {
          var redirect = sessionStorage.getItem('spa-redirect');
          if (!redirect) return;
          sessionStorage.removeItem('spa-redirect');

          // Only ever restore an address inside this deployment.
          var base = '%BASE_URL%';
          if (redirect.indexOf(base) !== 0) return;

          if (redirect !== window.location.pathname + window.location.search + window.location.hash) {
            history.replaceState(null, '', redirect);
          }
        } catch (e) {
          /* Storage unavailable: the visitor lands on the home route instead. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
