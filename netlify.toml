# Netlify deployment.
#
# The Next.js runtime plugin gives this app what it needs: server rendering,
# Server Actions, middleware and route handlers. A static host cannot.
#
# Set the environment variables in the Netlify UI, not here — they include the
# service role key, which must never be committed.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Scheduled maintenance sweep. Netlify Scheduled Functions are configured in
# the UI; alternatively call POST /api/reminders/sweep from any cron service
# with the Authorization: Bearer <REMINDER_SWEEP_SECRET> header.
