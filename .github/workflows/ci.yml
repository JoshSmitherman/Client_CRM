name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Nothing is fetched at build time, so placeholder credentials are
      # enough to prove the application compiles and bundles.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  smoke:
    name: The built app in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds twice — once for the domain root, once for a /<repo>/ sub-path —
      # serves each the way GitHub Pages does, and walks the routes in a real
      # browser. This is the only check that covers the single-page fallback,
      # which has no types to protect it.
      - name: Smoke test
        run: npm run smoke
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  database:
    name: Schema and Row Level Security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Applies every migration twice, then the generated single-file
      # setup.sql twice, then the Row Level Security assertions: tenant
      # isolation, internal notes and comments, cross-tenant writes, column
      # guards, state transitions, privilege escalation, audit immutability,
      # the staff signup ladder, and what a signed-out visitor can reach.
      - name: Verify the schema and security policies
        run: ./scripts/verify-schema.sh localhost 5432
        env:
          PGUSER: postgres
          PGPASSWORD: postgres

      # A stale setup.sql would silently ship a schema that does not match the
      # migrations, so the build output must be identical to what is committed.
      - name: Check supabase/setup.sql is up to date
        run: |
          node scripts/build-setup-sql.mjs
          if ! git diff --quiet -- supabase/setup.sql; then
            echo "::error file=supabase/setup.sql::setup.sql is out of date."
            echo "Run: node scripts/build-setup-sql.mjs   and commit the result."
            git diff --stat -- supabase/setup.sql
            exit 1
          fi
          echo "setup.sql matches the migrations"
