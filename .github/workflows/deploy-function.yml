name: Deploy the Supabase functions

# Publishes everything under supabase/functions to your Supabase project.
#
# These are the only pieces of the application that do not run in the browser.
# Both need the service role key, which bypasses every permission rule and so
# must never be in a web page:
#
#   invite-user   issues a portal or staff login
#   delete-user   permanently removes one
#
# Each verifies the caller's own token first and re-checks their permission
# against the database before using the key.
#
# Until these are deployed everything else works; inviting someone and deleting
# an account are the only things that will not.
#
# Needs two secrets:
#   SUPABASE_ACCESS_TOKEN   https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    The part of your project URL before .supabase.co
#
# Nothing else needs configuring: Supabase provides SUPABASE_URL,
# SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY to the function itself.
#
# See docs/GITHUB-SETUP.md.

on:
  push:
    # See the note in pages.yml about branch names.
    branches: [main, claude/inspiring-allen-snxv3i]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not configured yet is step 7 of the setup guide not being done, not a
      # failure. Everything except the "Invite someone" button works without it.
      - name: Check the secrets are present
        id: secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying yet — SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are not set. Add them under Settings > Secrets and variables > Actions (step 7 of docs/GITHUB-SETUP.md), then run this again."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
