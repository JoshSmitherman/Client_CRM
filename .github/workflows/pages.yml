name: Deploy to GitHub Pages

# Builds the application and publishes it to GitHub Pages.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   VITE_SUPABASE_URL        Supabase -> Project Settings -> API -> Project URL
#   VITE_SUPABASE_ANON_KEY   Supabase -> Project Settings -> API -> anon public
#
# Both are compiled into the JavaScript that anyone can read. That is how
# Supabase is designed to work: the anon key grants nothing on its own, and
# every read and write is checked against Row Level Security in Postgres using
# the signed-in person's token. The service role key is never used here.
#
# Turn Pages on first: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions". See docs/GITHUB-SETUP.md.

on:
  push:
    # The development branch is listed so the site can go live before the work
    # is merged. Once it is on main, delete that second line.
    branches: [main, claude/inspiring-allen-snxv3i]
  workflow_dispatch:

# Allows the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      # Before the keys are added this cannot build anything useful, but it is
      # not a failure — it is step 3 of the setup guide not being done yet.
      # Saying so and stopping keeps the repository green for someone who has
      # only just cloned it.
      - name: Check the secrets are present
        id: secrets
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying yet — VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are not set. Add them under Settings > Secrets and variables > Actions (step 3 of docs/GITHUB-SETUP.md), then run this again."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      - name: Configure Pages
        id: pages
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      # A project site is served from /<repo>/, so every asset and route has to
      # be built with that prefix. base_path comes back empty for a user or
      # organisation site served from the domain root.
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}

      # Pages serves files literally, so a request for /clients would 404.
      # The 404.html emitted by vite.config.ts records the address and hands it
      # back to the router.
      - name: Check the single-page fallback shipped
        if: steps.secrets.outputs.ready == 'true'
        run: test -f dist/404.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.secrets.outputs.ready == 'true'
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
